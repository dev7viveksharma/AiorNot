<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#070A10" />
    </linearGradient>

    <linearGradient id="aiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="100%" stop-color="#4FACFE" />
    </linearGradient>

    <linearGradient id="humanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5858" />
      <stop offset="100%" stop-color="#F093FB" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
    <filter id="laserGlow" x="-10%" y="-30%" width="120%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .pulse {
      animation: pulse 3s infinite ease-in-out;
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 0.8; }
    }
  </style>

  <circle cx="160" cy="160" r="160" fill="url(#bgGrad)" />

  <g transform="translate(0, 40)">
    <g stroke="url(#aiGrad)" stroke-width="1.5" opacity="0.4" class="pulse">
      <line x1="70" y1="70" x2="40" y2="50" />
      <line x1="70" y1="120" x2="30" y2="120" />
      <line x1="90" y1="160" x2="50" y2="190" />
      <circle cx="40" cy="50" r="4" fill="#00F2FE" />
      <circle cx="30" cy="120" r="4" fill="#00F2FE" />
      <circle cx="50" cy="190" r="4" fill="#00F2FE" />
    </g>

    <g stroke="url(#humanGrad)" stroke-width="2.5" fill="none" opacity="0.3" stroke-linecap="round">
      <path d="M 160,70 A 40,40 0 0,1 200,110" />
      <path d="M 160,50 A 60,60 0 0,1 220,110" />
      <path d="M 160,30 A 80,80 0 0,1 240,110" />
      <path d="M 160,90 A 20,20 0 0,1 180,110" />
    </g>

    <path d="M 70,60 L 160,30 L 250,60 L 230,160 L 160,210 L 90,160 Z" 
          fill="none" 
          stroke="#1F2937" 
          stroke-width="4" />

    <path d="M 160,30 L 70,60 L 90,160 L 160,210 Z" 
          fill="url(#aiGrad)" 
          opacity="0.85" />
          
    <polygon points="105,95 145,85 145,105 110,115" fill="#070A10" opacity="0.6"/>
    <line x1="110" y1="100" x2="140" y2="95" stroke="#00F2FE" stroke-width="3" filter="url(#glow)" stroke-linecap="round"/>

    <path d="M 160,30 L 250,60 L 230,160 L 160,210 Z" 
          fill="url(#humanGrad)" 
          opacity="0.85" />
          
    <path d="M 175,95 C 190,85 205,85 220,95 C 205,105 190,105 175,95 Z" fill="#070A10" opacity="0.5"/>
    <circle cx="197" cy="95" r="4" fill="#FF5858" filter="url(#glow)"/>

    <line x1="160" y1="28" x2="160" y2="212" stroke="#070A10" stroke-width="3" />

    <g filter="url(#laserGlow)">
      <line x1="160" y1="15" x2="160" y2="225" stroke="#38BDF8" stroke-width="3.5" stroke-linecap="round"/>
      <circle cx="160" cy="120" r="5" fill="#FFFFFF" />
    </g>
  </g>
</svg>
